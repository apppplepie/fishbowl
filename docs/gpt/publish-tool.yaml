            - text
            - image
            - code
            - diary
            - drawing
          default: text
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/RatedBlock"
          maxItems: 80
          minItems: 1
        status: *a3
        rating_reason:
          type: string
          maxLength: 2000
        metadata:
          $ref: "#/components/schemas/Metadata"
      required:
        - request_id
    UploadImage:
      type: object
      additionalProperties: false
      properties:
        base64:
          type: string
          description: "Image as a data URL: data:image/png;base64,<payload>. Supported:
            image/jpeg, image/png, image/webp, image/gif. Max 5MB after
            decoding."
        filename:
          type: string
          maxLength: 255
          description: Optional file name. Server generates one when omitted.
        title:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 2000
      required:
        - base64
