decisions:
- Actual frontend rating enum is P/G/M/A/R (1-5); the 1-10 comment is stale. GPT judges semantics; backend enforces
  enums and aggregates.
- Curation does not change title/category/type/ratings/cover; tags append by default, optional replace is explicit.
- Reordering uses block IDs; splitting validates exact original substrings and uses copy-on-write for shared blocks.
- New content defaults to draft; the same publishing tool transitions existing article status without duplicating
  content.
- Images are generated externally then registered and attached using media_id plus an existing block anchor.
- Added small article detail side table rather than changing legacy frontend summary fields.
- New management endpoints use active database admin/moderator identity and max_access_level; no implicit admin
  elevation.
- GET GPT article/list contracts move to v4 pagination and permissions; old POST routes remain compatible.
- Image generation provider integration and garden write tool deferred; garden design reuses existing DNA tables.
- Remote images require configured exact HTTPS hosts, validated/pinned public DNS, no redirects and bounded downloads.
next:
